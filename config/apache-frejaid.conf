# Apache HTTP config for frejaid.paftech.se
# Step 1: copy to /etc/apache2/sites-available/frejaid.conf
#         a2ensite frejaid.conf && apachectl configtest && systemctl reload apache2
# Step 2: run certbot (see apache-frejaid-le-ssl.conf for step 3 onwards)

<VirtualHost *:80>
    ServerName frejaid.paftech.se
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  /var/log/apache2/frejaid_error.log
    CustomLog /var/log/apache2/frejaid_access.log combined
</VirtualHost>
