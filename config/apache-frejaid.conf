# Apache config for frejaid.paftech.se — HTTP + HTTPS in one file.
# Copy to /etc/apache2/sites-available/frejaid.conf
# Fill in the two SECRET placeholders before enabling. Never commit secrets.
# After editing: sudo apachectl configtest && sudo systemctl reload apache2

# HTTP — redirect everything to HTTPS
<VirtualHost *:80>
    ServerName frejaid.paftech.se
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  /var/log/apache2/frejaid_error.log
    CustomLog /var/log/apache2/frejaid_access.log combined
</VirtualHost>

# HTTPS
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName frejaid.paftech.se

    # ---------------------------------------------------------------
    # Freja eID — OpenID Connect via mod_auth_openidc
    # ---------------------------------------------------------------
    OIDCProviderMetadataURL https://oidc.prod.frejaeid.com/oidc/.well-known/openid-configuration
    OIDCClientID            oidc-prod-paftech
    OIDCClientSecret        __PLACEHOLDER_OIDC_CLIENT_SECRET__
    OIDCRedirectURI         https://frejaid.paftech.se/oidc/callback

    # Generate with: openssl rand -hex 32
    OIDCCryptoPassphrase    "__PLACEHOLDER_OIDC_CRYPTO_PASSPHRASE__"

    OIDCScope               "openid email"
    OIDCRemoteUserClaim     email

    OIDCPassClaimsAs        environment

    OIDCCookieSameSite      Lax
    OIDCSessionInactivityTimeout 3600
    OIDCSessionMaxDuration  28800

    # ---------------------------------------------------------------
    # Strip any client-supplied Freja headers to prevent spoofing.
    # ---------------------------------------------------------------
    RequestHeader unset X-Remote-User
    RequestHeader unset X-Freja-Sub

    # ---------------------------------------------------------------
    # Reverse proxy to Go app
    # ---------------------------------------------------------------
    ProxyPreserveHost On
    ProxyPass        /oidc/ !
    ProxyPass        / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/

    RequestHeader set X-Forwarded-Proto "https"

    <Location "/oidc/">
        AuthType openid-connect
        Require valid-user
    </Location>

    <Location "/auth/freja">
        AuthType openid-connect
        Require valid-user

        RequestHeader set X-Remote-User "expr=%{reqenv:OIDC_CLAIM_email}"
        RequestHeader set X-Freja-Sub   "expr=%{reqenv:OIDC_CLAIM_sub}"
    </Location>

    # ---------------------------------------------------------------
    # SSL (managed by Certbot — do not edit these lines manually)
    # ---------------------------------------------------------------
    SSLCertificateFile    /etc/letsencrypt/live/frejaid.paftech.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/frejaid.paftech.se/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    LogLevel auth_openidc:info
    ErrorLog  /var/log/apache2/frejaid_error.log
    CustomLog /var/log/apache2/frejaid_access.log combined
</VirtualHost>
</IfModule>
