<VirtualHost *:80>
    ServerName frejaid.paftech.se
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog  /var/log/apache2/frejaid_error.log
    CustomLog /var/log/apache2/frejaid_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =frejaid.paftech.se
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
