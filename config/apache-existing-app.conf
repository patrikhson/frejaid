# Apache configuration for Scenario 1A: wrapping an existing application.
#
# This config adds FrejaID authentication in front of an app that is already
# running behind Apache (e.g. at https://yourapp.example.com).  The existing
# app does not need to be modified — it receives the authenticated user's
# identity as HTTP request headers and can use X-FrejaID-User-ID as the stable
# user key for its own database.
#
# Prerequisites:
#   - FrejaID is running at http://127.0.0.1:8091 (its own VirtualHost / port)
#   - mod_auth_request, mod_proxy, mod_proxy_http, mod_headers are enabled
#   - SSL is handled separately (e.g. via Let's Encrypt / mod_ssl)
#
# How it works:
#   1. Every request to yourapp.example.com first hits the AuthBasicProvider
#      stanza which calls mod_auth_request.
#   2. mod_auth_request makes a subrequest to http://127.0.0.1:8091/auth/check.
#   3. FrejaID reads the session cookie and responds 200 or 401.
#   4. On 200: Apache copies the X-FrejaID-* response headers onto the
#      forwarded request and proxies it to the existing app.
#   5. On 401: Apache redirects the browser to FrejaID's login page.

<VirtualHost *:443>
    ServerName yourapp.example.com

    # ── SSL (fill in your own certificate paths) ──────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yourapp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourapp.example.com/privkey.pem

    # ── FrejaID session check ─────────────────────────────────────────────────
    #
    # mod_auth_request makes an internal subrequest to /auth/check on every
    # incoming request.  The subrequest shares the browser's cookies, so
    # FrejaID can read the session cookie from it.
    #
    # IMPORTANT: the subrequest is forwarded to FrejaID, which runs on the
    # same server.  It must NOT be proxied through the block below that
    # sends traffic to the existing app.
    <Location /auth/check>
        ProxyPass http://127.0.0.1:8091/auth/check
    </Location>

    AuthType    none
    AuthName    "FrejaID"
    Require     valid-user

    # auth_request fires the subrequest and gates the request on the result.
    AuthRequestAuthoritative On
    auth_request /auth/check

    # On 401, redirect to FrejaID's login page instead of showing a browser
    # basic-auth dialog.  After login, FrejaID sends the browser back here.
    auth_request_set %{ENV:REDIRECT_STATUS} %{REQUEST_STATUS}
    ErrorDocument 401 "https://frejaid.paftech.se/auth/login"

    # ── Security: strip any X-FrejaID-* headers the client might send ────────
    #
    # Without these lines a malicious client could impersonate any user by
    # injecting X-FrejaID-User-ID in their request.  Apache removes them
    # before the auth_request result is added.
    RequestHeader unset X-FrejaID-User-ID
    RequestHeader unset X-FrejaID-User-Email
    RequestHeader unset X-FrejaID-User-Role
    RequestHeader unset X-FrejaID-User-Name

    # ── Copy the identity headers from the /auth/check response ──────────────
    #
    # mod_auth_request stores the subrequest response headers in environment
    # variables.  We then set them as request headers so the existing app
    # receives them.
    auth_request_set %{ENV:FREJAID_USER_ID}    %{resp_header:X-FrejaID-User-ID}
    auth_request_set %{ENV:FREJAID_USER_EMAIL} %{resp_header:X-FrejaID-User-Email}
    auth_request_set %{ENV:FREJAID_USER_ROLE}  %{resp_header:X-FrejaID-User-Role}
    auth_request_set %{ENV:FREJAID_USER_NAME}  %{resp_header:X-FrejaID-User-Name}

    RequestHeader set X-FrejaID-User-ID    %{FREJAID_USER_ID}e
    RequestHeader set X-FrejaID-User-Email %{FREJAID_USER_EMAIL}e
    RequestHeader set X-FrejaID-User-Role  %{FREJAID_USER_ROLE}e
    RequestHeader set X-FrejaID-User-Name  %{FREJAID_USER_NAME}e

    # ── Proxy to the existing app ─────────────────────────────────────────────
    #
    # Replace 127.0.0.1:PORT with the address your existing app listens on.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:PORT/
    ProxyPassReverse / http://127.0.0.1:PORT/
</VirtualHost>

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName yourapp.example.com
    Redirect permanent / https://yourapp.example.com/
</VirtualHost>
